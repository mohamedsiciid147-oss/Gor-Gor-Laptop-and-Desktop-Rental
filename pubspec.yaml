name: gorgor
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  flutter_easyloading: ^3.0.5
  random_string: ^2.3.1
  http: ^1.2.2
  permission_handler: ^12.0.0+1
  dio: ^5.9.2
  file_picker: ^10.1.9
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:

  uses-material-design: true

  assets:
   - images/
   - images/logo.png
# flutter pub get
# flutter pub run flutter_launcher_icons:main
flutter_icons:
  android: true
  remove_alpha_ios: true
  ios: true
  image_path: "images/logo.png"